name: Release

# Push a tag like v1.2 or v1.2.3 to build, sign, notarize and publish that version.
# Only plain numeric tags: every release becomes "latest", which installed copies announce.
on:
  push:
    tags: ["v[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  TEAM_ID: D2WYW5VN3J

jobs:
  release:
    name: Signed build
    runs-on: xcode-27   # the project format needs Xcode 27; Apple silicon only
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          # Fails here, with a clear message, if the certificate or its chain is not usable.
          security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application"

      - name: Build
        run: |
          xcodebuild -scheme diskman -configuration Release -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS=--timestamp CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/diskman.app

      - name: Make the disk image
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/diskman.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname diskman -srcfolder dmg -format UDZO "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
        env:
          DMG: diskman-${{ github.ref_name }}-arm64.dmg

      # Notarizing the image covers the app inside it. Only the image is stapled, so the app's
      # first launch on a Mac that never saw the image checks with Apple online.
      - name: Notarize
        env:
          DMG: diskman-${{ github.ref_name }}-arm64.dmg
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/asc.p8"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: diskman-${{ github.ref_name }}-arm64.dmg
        run: gh release create "$GITHUB_REF_NAME" "$DMG" --verify-tag --generate-notes
