name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: DiskmanCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        working-directory: DiskmanCore
        run: swift test

  app:
    name: App build
    runs-on: xcode-27   # the project format needs Xcode 27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Build
        run: xcodebuild -scheme diskman -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
